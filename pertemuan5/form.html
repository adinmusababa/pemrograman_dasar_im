<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Sidebar Toggle</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        /* 1. Styling Sidebar */
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease; /* Animasi mulus saat buka/tutup */
            overflow: hidden;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 1.2rem;
            background-color: #0f172a;
            white-space: nowrap;
        }

        .sidebar ul {
            list-style: none;
            padding: 20px 0;
        }

        .sidebar ul li a {
            display: block;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .sidebar ul li a:hover {
            background-color: #334155;
            color: white;
        }

        /* Kelas untuk menutup sidebar */
        .sidebar.closed {
            width: 0;
        }

        /* 2. Styling Konten Utama */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: white;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
        }

        /* Tombol Toggle */
        #toggle-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #toggle-btn:hover {
            background-color: #0369a1;
        }

        .content-body {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <h2>MedForm Pro</h2>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Pendaftaran</a></li>
            <li><a href="#">Data Pasien</a></li>
            <li><a href="#">Pengaturan</a></li>
        </ul>
    </aside>

    <!-- KONTEN UTAMA -->
    <div class="main-content">
        <header>
            <button id="toggle-btn">☰ Toggle Sidebar</button>
        </header>
        <div class="content-body">
            <h1>Halaman Utama</h1>
            <p>Klik tombol di atas untuk membuka atau menutup sidebar samping.</p>
        </div>
    </div>

</body>
</html>
