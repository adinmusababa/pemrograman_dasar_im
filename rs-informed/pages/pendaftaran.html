<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pasien Baru</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="page form-card">

    <header class="page-head">
        <h1>Form Pendaftaran Pasien Baru</h1>
        <p>Isi identitas, kontak, dan data medis pasien. Kolom bertanda * wajib diisi.</p>
    </header>

    <!-- Satu form untuk semua bagian, sehingga satu tombol mengirim semuanya -->
    <form action="#" method="post">

        <fieldset id="identitas">
            <legend>Data identitas</legend>

            <div class="field">
                <label class="req" for="nama">Nama lengkap</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            <div class="field">
                <label class="req" for="nik">NIK</label>
                <input type="text" id="nik" name="nik" maxlength="16" pattern="[0-9]{16}" inputmode="numeric" title="NIK terdiri dari 16 digit angka" required>
                <div class="hint">16 digit angka.</div>
            </div>
            <div class="row-2">
                <div class="field">
                    <label class="req" for="tgl_lahir">Tanggal lahir</label>
                    <input type="date" id="tgl_lahir" name="tgl_lahir" required>
                </div>
                <div class="field">
                    <label class="req" for="jk">Jenis kelamin</label>
                    <select id="jk" name="jk" required>
                        <option value="">Pilih jenis kelamin</option>
                        <option value="laki-laki">Laki-laki</option>
                        <option value="perempuan">Perempuan</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label class="req" for="gol_darah">Golongan darah</label>
                <select id="gol_darah" name="gol_darah" required>
                    <option value="">Pilih golongan darah</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="AB">AB</option>
                    <option value="O">O</option>
                </select>
            </div>
        </fieldset>

        <fieldset id="kontak">
            <legend>Data kontak</legend>

            <div class="field">
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3"></textarea>
            </div>
            <div class="row-2">
                <div class="field">
                    <label for="telepon">Nomor telepon</label>
                    <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com">
                </div>
            </div>
        </fieldset>

        <fieldset id="medis">
            <legend>Data medis</legend>

            <div class="field">
                <label for="riwayat">Riwayat penyakit</label>
                <textarea id="riwayat" name="riwayat" rows="3"></textarea>
            </div>
            <div class="field">
                <label for="alergi">Alergi</label>
                <textarea id="alergi" name="alergi" rows="3"></textarea>
            </div>
            <div class="field">
                <label for="dokter">Dokter penanggung jawab</label>
                <input type="text" id="dokter" name="dokter">
            </div>
        </fieldset>

        <div class="btn-row">
            <button type="submit" class="btn">Daftarkan pasien</button>
            <button type="reset" class="btn secondary">Kosongkan form</button>
        </div>
    </form>
</main>
</body>
</html>
